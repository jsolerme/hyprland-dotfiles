# ~/.config/hypr/hyprlock.conf

# Theming color import
source = ~/.config/hypr/theming/colors/colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor = eDP-1
    path = screenshot
    blur_passes = 2
    contrast = 0.8
    brightness = 0.3
    vibrancy = 0.3
}

input-field {
    monitor = eDP-1
    size = 150, 150
    outline_thickness = 5
    rounding = -1

    hide_input = true
    hide_input_base_color = $accent-alt
    outer_color = $accent
    inner_color = $background
    
    check_color = $success
    fail_color = $error

    capslock_color = $warning
    numlock_color = $warning
    bothlock_color = $warning

    font_color = $foreground
    
    position = 0, 0
    halign = center
    valign = center
}
